name: MakeCode-Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versionen in pxt.json und lib_version.ts vergleichen
        run: |
          PXT_VERSION=$(node -p "require('./pxt.json').version")
          LIB_VERSION=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' lib_version.ts)
          echo "pxt.json: $PXT_VERSION, lib_version.ts: $LIB_VERSION"
          if [ "$PXT_VERSION" != "$LIB_VERSION" ]; then
            echo "::error::Version in lib_version.ts ($LIB_VERSION) passt nicht zu pxt.json ($PXT_VERSION)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pxt installieren
        run: npm install -g pxt
      - name: micro:bit-Target laden
        run: pxt target microbit
      - name: Abhängigkeiten installieren
        run: pxt install
      - name: Erweiterung und test.ts bauen
        run: pxt build --cloud
